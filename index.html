<!DOCTYPE html>
<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║  index.html — هيكل الصفحة                                          ║
     ║                                                                  ║
     ║  ⚠️ مفيش هنا أي كلام أو صور ثابتة                                  ║
     ║     كل المحتوى بييجي من ملف clinic-config.js ← عدّل هناك           ║
     ║                                                                  ║
     ║  إزاي الربط شغال؟                                                  ║
     ║    data-t="hero.description"  ← العنصر ده بياخد كلامه من           ║
     ║                                  CLINIC_CONFIG.hero.description   ║
     ║    data-heading="about"       ← العنوان بياخد title + titleHighlight ║
     ║    id="...-list"              ← فاضي هنا، والـ JS بيملاه من الكونفج   ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OL ELLABIB | Aesthetic & Medical Center – Heliopolis, Cairo</title>
  <meta name="description" content="OL ELLABIB Aesthetic & Medical Center in Heliopolis, Cairo — dental excellence, dermatology, aesthetics and free online consultations via Google Meet." />
  <meta name="theme-color" content="#0c0c0c" />
  <!-- أيقونة الموقع اللي بتظهر في تاب المتصفح -->
  <link rel="icon" type="image/png" href="assets/images/logos/ol-dark.png" />
  <link rel="apple-touch-icon" href="assets/images/logos/ol-dark.png" />

  <!-- ============================================================
       منع "الومضة": بيطبق الوضع (غامق/فاتح) واللغة المحفوظين قبل ما الصفحة تترسم
       ============================================================ -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("ol-theme");
        var lang = localStorage.getItem("ol-lang");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
        if (lang === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    })();
  </script>

  <!-- ============================================================
       الخطوط: Cormorant Garamond + DM Sans (إنجليزي) / Amiri + Readex Pro (عربي)
       + أيقونات Material Symbols
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet" />

  <!-- مكتبات: Swiper (سلايدر الآراء) + GLightbox (تكبير صور المعرض) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/css/glightbox.min.css" />

  <!-- تصميم الموقع (الألوان والوضعين في أول الملف) -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ============================================================
       🔝 الهيدر الثابت = الشريط العلوي الصغير + القائمة الرئيسية
       ============================================================ -->
  <div class="site-header" id="site-header">

    <!-- الشريط العلوي: العنوان • المواعيد • التليفون • اللغة -->
    <div class="topbar">
      <div class="container topbar__inner">
        <div class="topbar__group">
          <a class="topbar__item" data-maps-link target="_blank" rel="noopener">
            <span class="icon">location_on</span><span data-t="clinic.shortAddress"></span>
          </a>
          <span class="topbar__item topbar__hours">
            <span class="icon">schedule</span><span data-t="clinic.hours.short"></span>
          </span>
        </div>
        <div class="topbar__group">
          <a class="topbar__item" data-phone-link>
            <span class="icon">call</span><span dir="ltr" data-t="clinic.phoneDisplay"></span>
          </a>
          <!-- زرار تغيير اللغة -->
          <div class="lang-switch" role="group" aria-label="Language">
            <span class="icon">language</span>
            <div class="lang-switch__pill">
              <button type="button" data-lang-btn="en">EN</button>
              <button type="button" data-lang-btn="ar">AR</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- القائمة الرئيسية -->
    <header class="navbar">
      <div class="container navbar__inner">
        <!-- اللوجو (بيتملي من الكونفج: صورة أو مكتوب) -->
        <a class="logo" href="#home" id="logo"></a>

        <!-- روابط القائمة (بتتملي من CLINIC_CONFIG.nav) -->
        <nav class="nav" id="nav-list" aria-label="Main"></nav>

        <div class="navbar__actions">
          <!-- زرار الوضع الفاتح/الغامق -->
          <button type="button" class="theme-toggle" id="theme-toggle" data-t-aria="ui.themeToggle">
            <span class="icon icon--dark">dark_mode</span>
            <span class="icon icon--light">light_mode</span>
          </button>
          <!-- زرار الحجز -->
          <a class="btn btn--gold btn--sm navbar__cta" href="#booking" data-t="ui.bookButton"></a>
          <!-- زرار القائمة في الموبايل -->
          <button type="button" class="burger" id="burger" aria-expanded="false" aria-controls="mobile-menu" data-t-aria="ui.menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <!-- قائمة الموبايل (بتتملي من نفس CLINIC_CONFIG.nav) -->
    <div class="mobile-menu" id="mobile-menu" hidden>
      <nav class="mobile-menu__list" id="mobile-nav-list" aria-label="Mobile"></nav>
      <a class="btn btn--gold btn--block" href="#booking" data-t="ui.bookButton"></a>
    </div>
  </div>

  <main>

    <!-- ============================================================
         1️⃣ البنر الرئيسي (Hero)  ← المحتوى من CLINIC_CONFIG.hero
         ============================================================ -->
    <section class="hero" id="home">
      <div class="hero__bg" data-bg="hero.image"></div>
      <div class="hero__scrim"></div>
      <div class="hero__glow"></div>

      <div class="container hero__content">
        <div class="hero__text">
          <span class="chip chip--pulse"><span class="chip__dot"></span><span data-t="hero.kicker"></span></span>
          <h1 class="hero__title">
            <span data-t="hero.title"></span><br />
            <em class="gold-gradient-text" data-t="hero.titleHighlight"></em>
          </h1>
          <p class="hero__desc" data-t="hero.description"></p>
          <div class="hero__actions">
            <a class="btn btn--gold btn--lg btn--glow" href="#booking">
              <span class="icon">videocam</span><span data-t="hero.primaryButton"></span><span class="icon icon--arrow">arrow_forward</span>
            </a>
            <a class="btn btn--ghost btn--lg" href="#clinics">
              <span class="icon icon--gold">medical_services</span><span data-t="hero.secondaryButton"></span>
            </a>
          </div>
        </div>

        <!-- لوجوهات العيادات: OL فوق، وتحته EVY (شمال) و Dr. Nour (يمين)
             بتتملي من CLINIC_CONFIG.clinic.brands، والصورة بتتغير مع الوضع الغامق/الفاتح -->
        <div class="hero__brands" id="hero-brands" hidden></div>
      </div>

      <!-- شريط الأرقام (العدادات) -->
      <div class="stats">
        <div class="container stats__grid" id="stats-list"></div>
      </div>
    </section>

    <!-- ============================================================
         2️⃣ عن العيادة (About)  ← CLINIC_CONFIG.about
         ============================================================ -->
    <section class="section" id="about">
      <div class="container about">
        <!-- الكارت الكبير: الكلام ونقاط الثقة -->
        <div class="about__main reveal">
          <div class="eyebrow"><span class="eyebrow__line"></span><span data-t="about.kicker"></span></div>
          <h2 class="h2" data-heading="about"></h2>
          <p class="lead" data-t="about.text"></p>
          <div class="trust-list" id="about-points"></div>
          <a class="btn btn--gold" href="#clinics" data-t="about.button"></a>
        </div>

        <!-- الكارت الجانبي (على شكل قوس): صورة + جملة + توقيع الدكتور -->
        <div class="about__side reveal">
          <div class="about__side-bg" data-bg="about.sideImage"></div>
          <div class="about__side-scrim"></div>
          <span class="chip chip--small"><span class="icon">verified_user</span><span data-t="about.sideBadge"></span></span>
          <blockquote class="about__quote">
            <svg class="about__quote-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-8.983z"/></svg>
            <p><span data-t="about.quoteLine1"></span><br /><em data-t="about.quoteLine2"></em></p>
            <span class="about__quote-line"></span>
          </blockquote>
          <div class="about__signature">
            <div>
              <p class="about__sig-name" data-t="about.signatureName"></p>
              <p class="about__sig-role" data-t="about.signatureRole"></p>
            </div>
            <span class="icon-circle"><span class="icon">award_star</span></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         ✨ الشريط المتحرك ← أسماء العيادات بتلف علطول
         بيتملي أوتوماتيك من عناوين الكروت في CLINIC_CONFIG.clinics (مش محتاج تعدّل هنا)
         ============================================================ -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" id="ticker-list"></div>
    </div>

    <!-- ============================================================
         3️⃣ العيادات والتخصصات (Clinics)  ← CLINIC_CONFIG.clinics
         ============================================================ -->
    <section class="section section--alt" id="clinics">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <div class="eyebrow"><span class="eyebrow__line"></span><span data-t="clinics.kicker"></span></div>
            <h2 class="h2 h2--xl" data-heading="clinics"></h2>
          </div>
          <p class="section-head__desc" data-t="clinics.description"></p>
        </div>
        <!-- الكروت بتتعمل أوتوماتيك من clinics.items -->
        <div class="clinics-grid" id="clinics-list"></div>
      </div>
    </section>

    <!-- ============================================================
         4️⃣ لماذا نحن (Why Us)  ← CLINIC_CONFIG.why
         ============================================================ -->
    <section class="section" id="why">
      <div class="container">
        <div class="card why reveal">
          <div class="why__glow"></div>
          <!-- الصورة + الختم اللي بيلف -->
          <div class="why__media">
            <div class="why__image" data-bg="why.image"></div>
            <div class="seal" aria-hidden="true">
              <svg viewBox="0 0 100 100" class="seal__ring">
                <path id="seal-path" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" fill="none" />
                <text><textPath href="#seal-path" id="seal-text"></textPath></text>
              </svg>
              <span class="icon seal__icon">verified</span>
            </div>
          </div>
          <!-- الكلام -->
          <div class="why__content">
            <div class="eyebrow"><span class="eyebrow__line"></span><span data-t="why.kicker"></span></div>
            <h2 class="h2 h2--xl" data-heading="why" data-heading-break></h2>
            <p class="lead" data-t="why.text"></p>
            <div class="why__features" id="why-features"></div>
            <div class="why__tags" id="why-tags"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         🏛️ جولة في العيادة (Clinic Tour)  ← CLINIC_CONFIG.tour
         صور المكان: الأولى أكبر واحدة، ولما الزائر يدوس على أي صورة بتكبر
         (على الموبايل الصور بتتسحب بالصباع يمين وشمال)
         ============================================================ -->
    <section class="section section--alt" id="tour">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <div class="eyebrow"><span class="eyebrow__line"></span><span data-t="tour.kicker"></span></div>
            <h2 class="h2 h2--xl" data-heading="tour"></h2>
          </div>
          <p class="section-head__desc" data-t="tour.description"></p>
        </div>
        <div class="tour-grid" id="tour-list"></div>
      </div>
    </section>

    <!-- ============================================================
         5️⃣ فريقنا (Meet Our Team)  ← CLINIC_CONFIG.doctors
         الكروت بتلف لوحدها علطول، والشريط بياخد عرض الشاشة كله
         ============================================================ -->
    <section class="section" id="doctors">
      <div class="container">
        <div class="section-head section-head--center">
          <div class="eyebrow eyebrow--center"><span class="eyebrow__line"></span><span data-t="doctors.kicker"></span><span class="eyebrow__line"></span></div>
          <h2 class="h2 h2--xl" data-heading="doctors"></h2>
        </div>
      </div>
      <div class="team-marquee reveal">
        <div class="team-marquee__track" id="doctors-list"></div>
      </div>
    </section>

    <!-- ============================================================
         6️⃣ حجز الاستشارة (Booking)  ← CLINIC_CONFIG.booking
         تاب 1: استشارة أونلاين (تقويم Google بيتحط جوه)
         تاب 2: زيارة في العيادة (فورم بيفتح واتساب)
         ============================================================ -->
    <section class="section section--alt" id="booking">
      <div class="container">
        <div class="section-head section-head--center">
          <span class="chip chip--small"><span class="icon">videocam</span><span data-t="booking.badge"></span></span>
          <h2 class="h2 h2--xl" data-heading="booking"></h2>
          <p class="section-head__desc" data-t="booking.description"></p>
        </div>

        <div class="booking reveal">
          <!-- التابين -->
          <div class="tabs" role="tablist">
            <button type="button" class="tabs__btn is-active" role="tab" aria-selected="true" data-tab="remote">
              <span class="icon">videocam</span><span data-t="booking.tabRemote"></span>
            </button>
            <button type="button" class="tabs__btn" role="tab" aria-selected="false" data-tab="clinic">
              <span class="icon">apartment</span><span data-t="booking.tabClinic"></span>
            </button>
          </div>

          <!-- تاب 1: Google Meet -->
          <div class="tab-panel" data-panel="remote">
            <div class="info-line" id="remote-note"><span class="icon">verified</span><span data-t="booking.remoteNote"></span></div>
            <!-- هنا تقويم جوجل بيتحط أوتوماتيك لو اللينك موجود في الكونفج -->
            <div id="calendar-embed"></div>
          </div>

          <!-- تاب 2: زيارة العيادة -->
          <div class="tab-panel" data-panel="clinic" hidden>
            <form class="form" id="clinic-form" novalidate>
              <div class="form__row">
                <label class="field">
                  <span class="field__label" data-t="ui.labelDept"></span>
                  <select name="dept" id="dept-select" class="field__input"></select>
                </label>
                <label class="field">
                  <span class="field__label" data-t="ui.labelName"></span>
                  <input name="name" type="text" class="field__input" required data-t-placeholder="ui.placeholderName" />
                </label>
              </div>
              <div class="form__row">
                <label class="field">
                  <span class="field__label" data-t="ui.labelPhone"></span>
                  <input name="phone" type="tel" dir="ltr" class="field__input" required data-t-placeholder="ui.placeholderPhone" />
                </label>
                <label class="field">
                  <span class="field__label" data-t="ui.labelDate"></span>
                  <input name="date" type="date" class="field__input" required />
                </label>
              </div>
              <div class="field">
                <span class="field__label" data-t="ui.labelTime"></span>
                <div class="slots">
                  <label class="slot"><input type="radio" name="time" value="timeMorning" checked /><span data-t="ui.timeMorning"></span></label>
                  <label class="slot"><input type="radio" name="time" value="timeAfternoon" /><span data-t="ui.timeAfternoon"></span></label>
                  <label class="slot"><input type="radio" name="time" value="timeEvening" /><span data-t="ui.timeEvening"></span></label>
                </div>
              </div>
              <label class="field">
                <span class="field__label" data-t="ui.labelNotes"></span>
                <textarea name="notes" rows="2" class="field__input" data-t-placeholder="ui.placeholderNotes"></textarea>
              </label>
              <div class="info-line"><span class="icon">chat</span><span data-t="booking.clinicNote"></span></div>
              <button type="submit" class="btn btn--gold btn--block btn--lg">
                <span class="icon">calendar_add_on</span><span data-t="ui.submitClinic"></span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         7️⃣ المعرض (Gallery)  ← CLINIC_CONFIG.gallery
         ============================================================ -->
    <section class="section" id="gallery">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <div class="eyebrow"><span class="eyebrow__line"></span><span data-t="gallery.kicker"></span></div>
            <h2 class="h2 h2--xl" data-heading="gallery"></h2>
          </div>
        </div>
        <div class="gallery-grid" id="gallery-list"></div>
      </div>
    </section>

    <!-- ============================================================
         8️⃣ آراء العملاء (Testimonials) ← سلايدر Swiper
         ============================================================ -->
    <section class="section" id="testimonials">
      <div class="container">
        <div class="section-head section-head--center">
          <div class="eyebrow eyebrow--center"><span class="eyebrow__line"></span><span data-t="testimonials.kicker"></span><span class="eyebrow__line"></span></div>
          <h2 class="h2 h2--quote" data-t="testimonials.title"></h2>
        </div>
        <div class="swiper testimonials-swiper">
          <div class="swiper-wrapper" id="testimonials-list"></div>
        </div>
        <div class="swiper-controls">
          <button type="button" class="round-btn" id="t-prev" aria-label="Previous"><span class="icon icon--flip">arrow_back</span></button>
          <div class="swiper-pagination" id="t-pagination"></div>
          <button type="button" class="round-btn" id="t-next" aria-label="Next"><span class="icon icon--flip">arrow_forward</span></button>
        </div>
      </div>
    </section>

  </main>

  <!-- ============================================================
       🔻 الفوتر (Contact)  ← CLINIC_CONFIG.footer + clinic
       ============================================================ -->
  <footer class="footer" id="contact">
    <div class="container">
      <div class="footer__grid">
        <!-- عمود 1: اللوجو والنبذة والسوشيال -->
        <div class="footer__col">
          <div class="footer__brand">
            <!-- لوجو الفوتر: نفس صورة clinic.logo (ولو مفيش صورة بيظهر الاسم المكتوب) -->
            <img class="footer__logo" id="footer-logo" alt="" hidden />
            <span class="footer__name" data-t="clinic.name"></span>
            <span class="footer__sub" data-t="clinic.subtitle"></span>
          </div>
          <p class="footer__text" data-t="footer.about"></p>
          <div class="footer__icons" id="footer-icons"></div>
        </div>
        <!-- عمود 2: المواعيد -->
        <div class="footer__col">
          <h4 class="footer__title" data-t="footer.hoursTitle"></h4>
          <div class="hours" id="hours-list"></div>
          <p class="footer__note" data-t="clinic.hours.note"></p>
        </div>
        <!-- عمود 3: روابط العيادات -->
        <div class="footer__col">
          <h4 class="footer__title" data-t="footer.linksTitle"></h4>
          <div class="footer__links" id="footer-links"></div>
        </div>
        <!-- عمود 4: التواصل -->
        <div class="footer__col">
          <h4 class="footer__title" data-t="footer.contactTitle"></h4>
          <div class="footer__contact">
            <a data-maps-link target="_blank" rel="noopener"><span class="icon">pin_drop</span><span data-t="clinic.fullAddress"></span></a>
            <a data-phone-link><span class="icon">call</span><span dir="ltr" data-t="clinic.phoneDisplay"></span></a>
            <a data-email-link><span class="icon">mail</span><span data-t="clinic.email"></span></a>
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <p>© <span id="year"></span> <span data-t="footer.copyright"></span></p>
      </div>
      <!-- اسم العيادة كبير وباهت في آخر الصفحة (ديكور) -->
      <div class="footer__wordmark" aria-hidden="true" data-t="clinic.name"></div>
    </div>
  </footer>

  <!-- شريط الموبايل السفلي: اتصال • واتساب • احجز (بيظهر على الموبايل بس، مكان زرار الواتساب العائم) -->
  <nav class="mobile-bar" aria-label="Quick actions">
